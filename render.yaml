services:
  - type: web
    name: virta-backend
    env: node
    plan: free
    rootDir: virta-react/server
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://digi-lab-grader.vercel.app,https://digital-lab-grader.vercel.app"
